<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Ahmad Agent</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Configuration -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-orange': '#f4a261',
              'brand-orange-dark': '#e76f51',
              'dark-bg': '#0d0d1a',
              'dark-accent': '#1c1c24'
            }
          }
        }
      }
    </script>

    <!-- ✅ Importmap: force all packages to use the same React version -->

{

    <style>
      body {
        background-color: #0d0d1a; /* Dark blue/black base */
        background-image:
          radial-gradient(at 80% 20%, hsla(28, 100%, 50%, 0.15) 0px, transparent 50%),
          radial-gradient(at 50% 120%, hsla(230, 100%, 70%, 0.2) 0px, transparent 50%);
        color: #e5e7eb; /* Default text color */
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      }
      .glassmorphism {
        background: rgba(28, 28, 30, 0.5); /* Semi-transparent dark grey */
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>

  <body class="text-zinc-300">
    <div id="root">
      <!-- Loading page will be displayed here initially -->
      <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-[#0d0d1a] via-[#1c1c24] to-[#0d0d1a] relative overflow-hidden">
        <!-- Animated background elements -->
        <div class="absolute inset-0">
          <div class="absolute top-1/4 left-1/4 w-64 h-64 bg-[#f4a261]/10 rounded-full blur-3xl animate-pulse"></div>
          <div class="absolute bottom-1/3 right-1/4 w-72 h-72 bg-[#e76f51]/10 rounded-full blur-3xl animate-pulse delay-1000"></div>
        </div>
        
        <!-- Main content -->
        <div class="relative z-10 flex flex-col items-center">
          <!-- Logo/Brand -->
          <div class="mb-8">
            <h1 class="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-[#f4a261] to-[#e76f51]">
              Ahmad Agent
            </h1>
          </div>
          
          <!-- Loading animation -->
          <div class="relative mb-12">
            <div class="w-24 h-24 border-4 border-[#f4a261]/30 rounded-full flex items-center justify-center">
              <div class="w-16 h-16 border-4 border-t-[#e76f51] border-r-[#f4a261] border-b-[#f4a261] border-l-[#e76f51] rounded-full animate-spin"></div>
            </div>
            
            <!-- Pulsing center dot -->
            <div class="absolute inset-0 flex items-center justify-center">
              <div class="w-3 h-3 bg-[#f4a261] rounded-full animate-pulse"></div>
            </div>
          </div>
          
          <!-- Loading text -->
          <div class="text-center">
            <p class="text-zinc-300 text-lg mb-2">Initializing AI systems</p>
            <div class="flex space-x-2 justify-center">
              <div class="w-2 h-2 bg-[#f4a261] rounded-full animate-pulse"></div>
              <div class="w-2 h-2 bg-[#f4a261] rounded-full animate-pulse delay-300"></div>
              <div class="w-2 h-2 bg-[#f4a261] rounded-full animate-pulse delay-700"></div>
            </div>
          </div>
        </div>
        
        <!-- Subtle grid pattern -->
        <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2MCIgaGVpZ2h0PSI2MCI+CiAgPHBhdGggZD0iTTAgMGg2MHY2MEgweiIgZmlsbD0ibm9uZSIvPgogIDxwYXRoIGQ9Ik0wIDBoNnY2SDB6IiB0cmFuc2Zvcm09InRyYW5zbGF0ZSgwLDMwKSIgZmlsbD0icmdiYSgxOTYsMTQ3LDExOSwwLjAyKSIvPgo8L3N2Zz4K')] opacity-20"></div>
      </div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
